esphome:
  name: server-cabinet-temp
  friendly_name: Server Cabinet Temperature Monitor

esp8266:
  board: nodemcuv2  # Correct for HiLetgo NodeMCU CP2102 ESP-12E
  framework:
    version: recommended  # Optional but recommended for stability

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "7N29geoYqbSxL0zbzEOLxpGQqV0kdWn9EYOZONC7lI4="

ota:
  - platform: esphome
    password: "b5a9691111f6c32048257c44ef8666c9"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Server-Cabinet-Temp"
    password: "HsBA239mnH6S"

captive_portal:

# Sensors Configuration
sensor:
  # Top of Cabinet DHT22
  - platform: dht
    pin: D1  # GPIO5 - Connect your top sensor's data pin here
    model: DHT22
    update_interval: 60s  # Update every minute
    temperature:
      name: "Cabinet Top Temperature"
      accuracy_decimals: 1
    humidity:
      name: "Cabinet Top Humidity"
      unit_of_measurement: "%"
      accuracy_decimals: 0

  # Bottom of Cabinet DHT22
  - platform: dht
    pin: D2  # GPIO4 - Connect your bottom sensor's data pin here
    model: DHT22
    update_interval: 60s
    temperature:
      name: "Cabinet Bottom Temperature"
      accuracy_decimals: 1
    humidity:
      name: "Cabinet Bottom Humidity"
      unit_of_measurement: "%"
      accuracy_decimals: 0

  # Bonus: WiFi Signal Strength
  - platform: wifi_signal
    name: "Cabinet WiFi Signal"
    update_interval: 60s

  # Bonus: Uptime
  - platform: uptime
    name: "Cabinet Monitor Uptime"